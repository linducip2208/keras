name: hris_mobile
description: HRIS Indonesia mobile app — Karyawan ESS (clock-in, cuti, slip gaji, approval)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # HTTP + Network
  dio: ^5.5.0
  retrofit: ^4.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # Auth & Security
  local_auth: ^2.3.0

  # Location & Camera
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.13.0

  # UI
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # PDF
  open_filex: ^4.5.0
  path_provider: ^2.1.4

  # Push notification
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.1
  flutter_local_notifications: ^17.2.3

  # Utils
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  equatable: ^2.0.5
  package_info_plus: ^8.0.1
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.1
  retrofit_generator: ^9.1.0
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
