name: hris_mobile
description: HRIS Indonesia mobile app — Karyawan ESS (clock-in, cuti, slip gaji, approval)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP + Network
  dio: ^5.5.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # Auth & Security
  local_auth: ^2.3.0

  # Location & Camera
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

  # UI
  cached_network_image: ^3.4.0
  intl: ^0.19.0

  # PDF
  open_filex: ^4.5.0
  path_provider: ^2.1.4

  # Utils
  equatable: ^2.0.5
  package_info_plus: ^8.0.1
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
