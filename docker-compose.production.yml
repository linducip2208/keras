version: '3.9'

# Production deployment composition for HRIS Indonesia.
# Targeted untuk VPS Indonesia (Biznet/Niagahoster/IDCloudHost) — data residency UU PDP.
#
# Deploy:
#   docker compose -f docker-compose.production.yml up -d
#
# Required files:
#   - .env.production (DB credentials, APP_KEY, redis password, license server URL)
#   - nginx/sites-enabled/hris.conf (vhost config — auto-mounted)
#   - certbot/conf for Let's Encrypt SSL

services:
  app:
    image: hris/app:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hris_app
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - mysql
      - redis
    networks:
      - hris_net

  nginx:
    image: nginx:1.27-alpine
    container_name: hris_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/sites-enabled:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - hris_net

  mysql:
    image: mysql:8.4
    container_name: hris_mysql
    restart: unless-stopped
    env_file: .env.production
    environment:
      MYSQL_DATABASE: hris
      MYSQL_USER: hris
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/backup:/backup
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=300
    networks:
      - hris_net

  redis:
    image: redis:7.4-alpine
    container_name: hris_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hris_net

  queue:
    image: hris/app:latest
    container_name: hris_queue
    restart: unless-stopped
    env_file: .env.production
    command: php artisan queue:work --tries=3 --backoff=30 --memory=512 --timeout=300
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - hris_net

  scheduler:
    image: hris/app:latest
    container_name: hris_scheduler
    restart: unless-stopped
    env_file: .env.production
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - hris_net

  minio:
    image: minio/minio:latest
    container_name: hris_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - hris_net

  certbot:
    image: certbot/certbot:latest
    container_name: hris_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  hris_net:
    driver: bridge
