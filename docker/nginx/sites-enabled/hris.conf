server {
    listen 80;
    server_name hris.app *.hris.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hris.app *.hris.app;

    ssl_certificate /etc/letsencrypt/live/hris.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Static assets long cache
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|css|js|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block .env, .git, etc.
    location ~ /\.(?!well-known) { deny all; }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
}
